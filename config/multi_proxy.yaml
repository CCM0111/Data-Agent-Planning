# Reuse ONLY the model section of the existing config; no old search/experience workflow.
model_config: config/data_agent.yaml
workflow:
  proxy_train_ratio: 0.05
  proxy_train_min_rows: 500
  proxy_train_max_rows: 10000
  coreset_ratio: 0.10
  coreset_max_rows: 5000
  # Optional explicit *_rows override the corresponding ratio and max_rows.
  # proxy_train_rows: 100
  # coreset_rows: 200
  core_validation_ratio: 0.05  # Fraction of fixed train, independent of coreset.
  core_validation_min_rows: 300
  # core_validation_rows: 500  # Explicit request, subject to the 5% validation floor.
  n_strategies: 3
  # Proxy coresets: global selection, classification >=1 per class; no regression-bin quotas.
  # GMM coreset alone preserves proportional stratum quotas. P/V_core splitting is unchanged.
  n_coresets: 4  # Three proxy-error subsets plus one GMM-density subset.
  gmm_components: 5
  gmm_max_iter: 100
  gmm_seed: 2026
  regression_bins: 5
  error_clip_quantile: 0.95
  # v2 sparse normalization: p * min(neighbors, p - 1); stronger than v1 at the same lambda.
  lambda: 1.0
  split_seed: 2026
  representation_seed: 2026
  graph_seed: 2026
  model_seed: 101
  batch_size: 2048
  max_dimensions: 20
  max_categories: 32  # Shared representation and generated method FE use this same value.
  graph_block_size: 2000  # Sorted fixed-seed 1D projection, then block-local mutual kNN.
  neighbors: 20
  id_columns: []
  leakage_columns: []
  categorical_columns: []
  scoring_budget:
    max_trees: 100
    max_epochs: 5
    timeout_seconds: 120
  full_train_enabled: true  # Requires fingerprinted frozen external validation; test is never read.
  full_train_budget:
    max_trees: 500
    max_epochs: 200
    timeout_seconds: 3000  # Whole fit/predict process, per method.
  evaluation_budget:
    max_trees: 100
    max_epochs: 50
    timeout_seconds: 300  # Whole subprocess, including fit, full prediction and IO.
  stage1_selection:
    enabled: true
    mode: record_only  # Record MCS survivors; all three methods still enter full train.
    bootstrap_replicates: 2000
    bootstrap_seed: 2026
    alpha: 0.05
    coreset_weights: [0.25, 0.25, 0.25, 0.25]
    mcts_admission:
      min_active_methods: 2  # Backfill by initial_value; preserve raw MCS membership.
      min_expansions_per_method: 1  # Required future search budget; does not launch MCTS.
# DeepSeek direct API automatically records CNY cost bounds using the official
# 2026-10-13 snapshot in data_agent/deepseek_usage.py (cache-aware).
# Optional: deepseek_period: peak / off_peak under pricing, ONLY when all calls
# are known to be billed in that period. Default unknown reports both bounds.
# Other optional user-supplied pricing (separate legacy estimate):
# pricing:
#   input_per_million: ...
#   output_per_million: ...
#   currency: ...
